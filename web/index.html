<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Point Cloud Fractals — WebGPU</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <canvas id="gpu"></canvas>

  <div id="ui">
    <header>
      <span>Point Cloud Fractals</span>
      <button id="toggle" title="Collapse">–</button>
    </header>
    <div class="body">
      <label class="row">
        <span>Fractal</span>
        <select id="preset"></select>
      </label>

      <label class="row" id="countRow">
        <span>Transforms</span>
        <input type="range" id="pcount" min="2" max="8" step="1" />
        <span id="pcountVal" class="val"></span>
      </label>

      <label class="row check">
        <input type="checkbox" id="animate" />
        <span>Morph between random forms</span>
      </label>

      <label class="row" title="The function used to ease the current form toward each new target.">
        <span>Morph</span>
        <select id="morphFn"></select>
      </label>

      <label class="row" title="How fast the morph function eases toward the target form.">
        <span>Morph speed</span>
        <input type="range" id="speed" min="0.1" max="6" step="0.1" />
        <span id="speedVal" class="val"></span>
      </label>

      <div class="row">
        <button id="randomize" class="full">Randomize ⟳</button>
      </div>

      <label class="row" title="Load a previously saved shape.">
        <span>Saved</span>
        <select id="shapeList"></select>
      </label>
      <div class="row btns">
        <button id="saveShape" title="Save the current shape">Save current</button>
        <button id="deleteShape" title="Delete the selected saved shape">Delete</button>
      </div>

      <label class="row">
        <span>Particles</span>
        <select id="particles"></select>
      </label>

      <label class="row" title="Preset color combinations.">
        <span>Theme</span>
        <select id="theme"></select>
      </label>

      <div class="row colors">
        <label><span>Color</span><input type="color" id="pColor" /></label>
        <label><span>Shadow</span><input type="color" id="oColor" /></label>
        <label title="Background color"><span>BG</span><input type="color" id="bgColor" /></label>
      </div>

      <label class="row">
        <span>AO strength</span>
        <input type="range" id="occMul" min="0" max="3" step="0.01" />
      </label>

      <label class="row">
        <span>AO falloff</span>
        <input type="range" id="occAtt" min="0" max="5" step="0.01" />
      </label>

      <label class="row" title="World-space size of the fractal. The voxel lighting grid scales with it, so the ambient-occlusion resolution stays constant at any size.">
        <span>Scale</span>
        <input type="range" id="pad" min="0.1" max="1.5" step="0.01" />
        <span id="padVal" class="val"></span>
      </label>

      <div class="sep"></div>

      <label class="row check" title="Acerola's anisotropic Kuwahara filter — a flow-aligned painterly / oil-painting look.">
        <input type="checkbox" id="kuwahara" />
        <span>Kuwahara filter</span>
      </label>

      <label class="row" id="kuwSizeRow" title="Kuwahara kernel size (larger = broader strokes, slower).">
        <span>Brush size</span>
        <input type="range" id="kuwSize" min="2" max="28" step="2" />
        <span id="kuwSizeVal" class="val"></span>
      </label>

      <label class="row" id="kuwSharpRow" title="Kuwahara sharpness — how crisp the color segments are.">
        <span>Sharpness</span>
        <input type="range" id="kuwSharp" min="1" max="18" step="0.5" />
        <span id="kuwSharpVal" class="val"></span>
      </label>

      <label class="row" title="Glow around the bright parts of the fractal. 0 disables it.">
        <span>Bloom</span>
        <input type="range" id="bloom" min="0" max="4" step="0.05" />
        <span id="bloomVal" class="val"></span>
      </label>
    </div>
    <footer><span id="fps"></span></footer>
  </div>

  <div id="hint">drag · orbit &nbsp;|&nbsp; scroll · zoom &nbsp;|&nbsp; right-drag · pan &nbsp;|&nbsp; space · morph &nbsp;|&nbsp; F · new &nbsp;|&nbsp; H · hide</div>

  <div id="error" class="hidden">
    <div>
      <h1>WebGPU unavailable</h1>
      <p></p>
      <small>Try a recent Chrome, Edge, or another WebGPU-capable browser, served over http://localhost or https.</small>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
